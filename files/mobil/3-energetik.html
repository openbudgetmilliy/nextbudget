<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MilliyJamoasi — Ovoz bering, 20 000 so'm oling</title>
<meta name="theme-color" content="#ffd400" />
<meta name="description" content="Ochiq byudjet loyihalariga ovoz bering — har bir ovoz uchun 20 000 so'm." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

<!--#base-->
<style>
/* ==========================================================================
   Umumiy skelet — beshala variant uchun bir xil.

   Nega alohida blok: variantlar faqat rang va shrift bilan farq qiladi,
   tuzilishi esa bitta — reklama trafigi uchun tekshirilgan joylashuv.
   Shu blok `files/mobil/index.html` preview sahifasiga ham ko'chiriladi.
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

/* Ekran — to'liq balandlikdagi ustun.
   `.mid` cho'ziladi, `.cta` esa pastdan 5vh chekinadi: shunda tugmalar
   ekranning pastki-o'rta uchdan birida, bosh barmoq yetadigan zonada qoladi
   va telefon pastidagi brauzer paneliga yopishib qolmaydi. */
.screen {
  /* Shrift shu yerda ham belgilanadi: ekran boshqa sahifaga (masalan
     `preview.html`) joylashtirilganda tashqi shriftni meros qilmasin. */
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  position: relative; isolation: isolate;
  display: flex; flex-direction: column;
  min-height: 100dvh; overflow: hidden;
  padding: max(16px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
}
.wrap {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; flex: 1;
  width: 100%; max-width: 440px; margin: 0 auto;
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mid { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
.cta { display: grid; gap: 12px; padding-bottom: 5vh; }

/* Barmoq zonasi: 60px — Apple/Google tavsiyasidan (44/48px) ancha katta,
   chunki reklama trafigi shoshib bosadi. */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 60px; padding: 0 20px;
  font: inherit; font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
  text-decoration: none; cursor: pointer; border: 0;
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.975); }
.note { text-align: center; font-size: 12.5px; line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<!--/#base-->

<style>body { background: #ffd400; }</style>

<!--#style-->
<style>
/* ── 3-variant · YORQIN / ENERGETIK ────────────────────────────────────────
   Sariq fon, qora qalin harflar, qattiq soya (neo-brutalizm). Lentada
   qo'lni to'xtatadigan eng "shovqinli" variant — matn kam, kegl katta,
   hamma narsa bitta ekranga sig'adi.
   ------------------------------------------------------------------------ */
.v3 {
  --ink: #0a0a0a; --bg: #ffd400; --paper: #fff;
  background: var(--bg); color: var(--ink);
}
.v3 .bg { position: absolute; inset: 0; z-index: 0;
  background-image: radial-gradient(rgba(0,0,0,.09) 1.4px, transparent 1.4px);
  background-size: 16px 16px; }

.v3 .brand { display: flex; align-items: center; gap: 9px;
  font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.v3 .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--paper);
  border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.v3 .mark img { width: 24px; height: 24px; }
.v3 .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  background: var(--ink); color: var(--bg); padding: 7px 11px; border-radius: 999px; }

.v3 .title { font-size: clamp(38px, 12vw, 52px); line-height: .96; font-weight: 800;
  letter-spacing: -0.045em; text-transform: uppercase; }
.v3 .sticker { display: inline-block; transform: rotate(-2.2deg); margin-top: 14px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
  padding: 12px 18px; box-shadow: 6px 6px 0 var(--ink); }
.v3 .sNum { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.v3 .sLab { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.v3 .sub { margin-top: 20px; font-size: 17px; line-height: 1.45; font-weight: 500; max-width: 20em; }

.v3 .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.v3 .pill { font-size: 12.5px; font-weight: 700; background: var(--paper);
  border: 2px solid var(--ink); border-radius: 999px; padding: 7px 13px; }

.v3 .arrow { display: grid; place-items: center; margin-bottom: 6px;
  animation: v3b 1.5s ease-in-out infinite; }
@keyframes v3b { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

.v3 .primary { background: var(--ink); color: var(--bg); border-radius: 14px;
  border: 3px solid var(--ink); box-shadow: 5px 5px 0 rgba(0,0,0,.28);
  text-transform: uppercase; letter-spacing: .02em; }
.v3 .ghost { background: var(--paper); color: var(--ink); border-radius: 14px;
  border: 3px solid var(--ink); box-shadow: 5px 5px 0 rgba(0,0,0,.28);
  text-transform: uppercase; letter-spacing: .02em; }
.v3 .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 rgba(0,0,0,.28); }
.v3 .note { font-weight: 600; color: rgba(0,0,0,.62); }
</style>
<!--/#style-->
</head>
