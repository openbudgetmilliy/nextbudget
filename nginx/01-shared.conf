# /etc/nginx/conf.d/01-shared.conf
#
# http{} darajasidagi umumiy sozlamalar — ikki brend ham ishlatadi.

# ── Siqish ──
# next.config.js da `compress: false` — Node CPU'ni bandi qilmaymiz.
# Origin → CF orasida gzip, CF → foydalanuvchi orasida brotli (CF panelida).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/manifest+json
    image/svg+xml font/woff font/woff2;

# ── Rate limit zonalari ──
#
# MUHIM — CGNAT: O'zbekiston mobil operatorlari (Ucell, Beeline, Uzmobile)
# minglab abonentni bitta public IP orqali chiqaradi. Shu sabab `/api/e`
# uchun spec'dagi 30r/m juda past — bitta operator IP'si ortidagi haqiqiy
# foydalanuvchilar bloklanib, analitika yo'qolardi.
#
# `/api/e` DB'ga tegmaydi (Redis'ga fire-and-forget), body 20KB bilan
# cheklangan, shuning uchun bu yerda limit keng: DDoS'ni Cloudflare tutadi.
limit_req_zone $binary_remote_addr zone=ev:10m   rate=300r/m;   # analitika
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;    # boshqa API (lead)
limit_req_zone $binary_remote_addr zone=adm:10m  rate=10r/m;    # admin
limit_req_zone $binary_remote_addr zone=page:10m rate=120r/m;   # sahifalar

# Bitta IP'dan parallel ulanish soni
limit_conn_zone $binary_remote_addr zone=perip:10m;

limit_req_status 429;
limit_conn_status 429;

# ── Log formati (CF cache holati bilan) ──
log_format cf '$remote_addr $host "$request" $status $body_bytes_sent '
              '"$http_referer" "$http_user_agent" '
              'rt=$request_time ua=$upstream_response_time '
              'cf=$http_cf_ray country=$http_cf_ipcountry';

# Statik faylni loglamaymiz — disk bekorga to'lmasin
map $uri $loggable {
    default              1;
    ~^/_next/static/     0;
    ~^/favicon           0;
}

# ── Umumiy proxy sozlamalari ──
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header CF-IPCountry $http_cf_ipcountry;

proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;

# Node yiqilsa/qayta yuklanayotsa boshqa instance'ga o'tamiz
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

server_tokens off;
client_max_body_size 64k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 65s;
reset_timedout_connection on;
