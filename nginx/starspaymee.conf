# /etc/nginx/sites-available/starspaymee
#   ln -s /etc/nginx/sites-available/starspaymee /etc/nginx/sites-enabled/
#
# Oldindan: conf.d/00-cloudflare-realip.conf va conf.d/01-shared.conf o'rnatilgan.

upstream sp {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# ── Noma'lum Host / to'g'ridan-to'g'ri IP bilan kirish → uzamiz ──
# Origin IP'ni skanerlab topganlar hech narsa ko'rmaydi.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/cf-sp.pem;
    ssl_certificate_key /etc/ssl/cf-sp.key;
    ssl_reject_handshake off;

    return 444;
}

# ── HTTP → HTTPS ──
server {
    listen 80;
    server_name starspaymee.uz www.starspaymee.uz;
    return 301 https://starspaymee.uz$request_uri;
}

# ── www → apex ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.starspaymee.uz;

    ssl_certificate     /etc/ssl/cf-sp.pem;
    ssl_certificate_key /etc/ssl/cf-sp.key;

    return 301 https://starspaymee.uz$request_uri;
}

# ── Asosiy ──
server {
    listen 443 ssl;
    http2 on;
    server_name starspaymee.uz;

    # Cloudflare Origin Certificate (15 yil)
    ssl_certificate     /etc/ssl/cf-sp.pem;
    ssl_certificate_key /etc/ssl/cf-sp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSLsp:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    access_log /var/log/nginx/sp.access.log cf if=$loggable;
    error_log  /var/log/nginx/sp.error.log warn;

    limit_conn perip 24;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Statik build assetlari: bir yil, immutable ──
    location /_next/static/ {
        proxy_pass http://sp;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /favicon.ico {
        proxy_pass http://sp;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── Analitika collector — eng issiq yo'l ──
    # DB'ga tegmaydi, Redis'ga fire-and-forget. Limit keng (CGNAT sababi
    # 01-shared.conf da tushuntirilgan).
    location = /api/e {
        limit_req zone=ev burst=100 nodelay;
        client_max_body_size 20k;
        proxy_pass http://sp;
        access_log off;
    }

    # ── Admin API ──
    location /api/admin/ {
        limit_req zone=adm burst=5 nodelay;
        # Faqat o'z IP'ingizdan ruxsat berish uchun quyidagini yoqing
        # (yoki Cloudflare Access / WAF Custom Rule ishlatilsin):
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://sp;
    }

    # ── Qolgan API ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://sp;
    }

    # ── Admin panel ──
    location /admin {
        limit_req zone=adm burst=10 nodelay;
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://sp;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Landing (SSG) ──
    # Trafikning ~97% shu yergacha yetib kelmaydi — Cloudflare edge'da to'xtaydi.
    location / {
        limit_req zone=page burst=60 nodelay;
        proxy_pass http://sp;
    }
}
