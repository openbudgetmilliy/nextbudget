# DB qatlami. Faqat 127.0.0.1 ga bog'langan — tashqaridan kirib bo'lmaydi.
# Ikki brend (starspaymee, brand-b) shu bitta stack'ni baham ko'radi.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-sp_user}
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS kerak}
      POSTGRES_DB: ${PG_DB:-starspaymee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c wal_compression=on
        -c log_min_duration_statement=1000
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-sp_user} -d ${PG_DB:-starspaymee}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 900M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sp-pgbouncer
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${PG_USER:-sp_user}
      DB_PASSWORD: ${PG_PASS:?PG_PASS kerak}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 10
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 60
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - '127.0.0.1:6432:5432'
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 96M

  redis:
    image: redis:7-alpine
    container_name: sp-redis
    restart: always
    # appendonly no — analitika buferi, disk sinxronizatsiyasi kerak emas.
    # allkeys-lru + worker'dagi LTRIM navbatni cheklab turadi.
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --save ''
        --tcp-keepalive 60
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  pgdata:
